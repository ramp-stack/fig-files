[package]
name = "fig-files"
version = "0.1.0"
edition = "2024"
default-run = "fig-files"
description = "Native AIR-backed file manager built with CHK, with shared read/write access to files and folders."
repository = "https://github.com/ramp-stack/fig-files"

[dependencies]
ramp = {package = "ramp2", version = "3.0.4"}
chk = { features = ["pelican_ui"], path = "../chk"}

futures = "0.3.34"
include_dir = "0.7.4"
serde = {version = "1", features = ["derive"]}
uuid = {version = "1", features = ["v4"]}
prism = {package = "prism2", version = "3.1.0"}
resvg = {version = "0.47.0", default-features = false, features = ["text", "system-fonts", "raster-images"]}

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-graphics = {version = "0.3.2", default-features = false, features = ["std", "CGAffineTransform", "CGGeometry", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGImage", "CGPDFDocument", "CGPDFPage"]}
objc2-core-foundation = {version = "0.3.2", default-features = false, features = ["std", "CFData", "CFCGTypes"]}

[lib]
name="main"
crate-type=["staticlib", "cdylib", "rlib"]

[dev-dependencies]
air = "4.0.1"
postcard = {version = "1.1", features = ["alloc"]}
media = {package = "media2", version = "0.1.1"}

[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.yazi]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3

[package.metadata.piston.ios]
team = "RYYG6X8WK7"
bundle_id = "org.ramp.figfiles"
minimum_os = "17.0"
info_plist = "ios/Info.plist"
entitlements = "ios/FigFiles.entitlements"
resources = ["ios/FigFilesLaunchScreen.storyboard", "ios/FigFilesLaunchIcon.png"]
build_number = "6"

